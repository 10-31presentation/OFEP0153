<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="現在時刻と次の列車を直感的に確認できる発車案内アプリ">
    <title>Next Train — 田町駅</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Google+Sans+Code:wght@500;700&display=swap">
    <!-- Only the characters used in the service badges are needed from the dot font. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&text=%E5%90%84%E5%81%9C%E5%BF%AB%E9%80%9F&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js" defer></script>
    <script src="sketch.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="site-header">
        <h1>Next Train</h1>
        <p class="station-name">田町<span class="station-suffix">駅</span></p>
      </header>
      <div class="clock">
        <p class="clock-label" aria-hidden="true">現在時刻</p>
        <div id="clock-canvas" aria-hidden="true"></div>
      </div>
      <time id="current-time" class="sr-only"></time>
      <nav class="platform-filter" aria-label="番線で絞り込み">
        <button type="button" data-platform="all" aria-pressed="true">すべて</button>
        <button type="button" data-platform="1" aria-pressed="false">1番線</button>
        <button type="button" data-platform="2" aria-pressed="false">2番線</button>
        <button type="button" data-platform="3" aria-pressed="false">3番線</button>
        <button type="button" data-platform="4" aria-pressed="false">4番線</button>
      </nav>
      <ol id="train-list" class="train-list" aria-label="次の列車"></ol>
      <p id="empty-state" class="empty-state" hidden></p>
      <p id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    </main>
  </body>
</html>
